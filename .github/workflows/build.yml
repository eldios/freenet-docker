name: build

# No step interpolates event-controlled data into a shell, which is the usual
# way these workflows get taken over. Keep it that way: if a run: step is ever
# added, pass values through env: instead of ${{ }}.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: freenet

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: actionlint
        uses: raven-actions/actionlint@v2

      - name: shellcheck
        run: shellcheck test/smoke.sh

  smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      # Single architecture and loaded locally: this job answers "does it
      # start", which is cheap, and leaves publishing to the build job.
      - uses: docker/setup-buildx-action@v4

      - name: Build stable
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: stable
          load: true
          tags: freenet-local:stable

      - name: Build dev
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: dev
          load: true
          tags: freenet-local:dev

      - name: Smoke test
        run: ./test/smoke.sh

  build:
    runs-on: ubuntu-latest
    needs: [lint, smoke]
    strategy:
      matrix:
        target: [stable, dev]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # Builds run on every push so a broken Dockerfile is caught before a
      # tag is cut; only tags are published.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=${{ matrix.target == 'dev' && '-dev' || '' }},onlatest=true
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # GHCR is the registry this repository publishes to. Docker Hub is a
      # mirror for discoverability, copied from the image just pushed rather
      # than rebuilt, and allowed to fail without taking the release with it.
      - name: Docker Hub tags
        id: hub
        if: startsWith(github.ref, 'refs/tags/') && vars.DOCKERHUB_USERNAME != ''
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=${{ matrix.target == 'dev' && '-dev' || '' }},onlatest=true
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/') && vars.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror to Docker Hub
        if: startsWith(github.ref, 'refs/tags/') && vars.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        env:
          SOURCE_TAGS: ${{ steps.meta.outputs.tags }}
          TARGET_TAGS: ${{ steps.hub.outputs.tags }}
        run: |
          source="$(printf '%s\n' "$SOURCE_TAGS" | head -1)"
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TARGET_TAGS"
          docker buildx imagetools create "${args[@]}" "$source"
